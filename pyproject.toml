[project]
name = "oarepo-config"
version = "1.0.0"
description = ""
readme = "README.md"
authors = [
    { name = "Ronald Krist", email = "krist@cesnet.cz" }
]
requires-python = ">=3.14,<3.15"

dependencies = [
    "oarepo[rdm,tests]>=14.2.1b11.dev1,<15.0.0",
]

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-config"

[project.optional-dependencies]
dev = [
    "oarepo-invenio-typing-stubs>=0.1.0dev0,<1.0.0",
    "types-PyYAML",
    "lxml-stubs",
]
tests = [
    "pytest-invenio>=4.0.0,<5.0.0",
    "pytest-oarepo>=6.0.0,<7.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]

[project.entry-points."invenio_config.module"]
oarepo = "oarepo.config.initial_configuration"
invenio_app_rdm = "oarepo.config.initial_rdm_config"

[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_config",
]

[[tool.mypy.overrides]]
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
