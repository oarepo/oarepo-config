[project]
name = "oarepo-config"
version = "3.0.0"
description = "Helper library for writing a clean, high-level invenio.cfg for OARepo/Invenio-RDM based repositories"
readme = "README.md"
authors = [
    { name = "Ronald Krist", email = "krist@cesnet.cz" }
]
requires-python = ">=3.14,<3.15"

dependencies = [
    "oarepo[rdm,tests]>=14.2.1b11.dev1,<15.0.0",

    # invenio dependencies
    "invenio-administration>=6.0.0,<7.0.0",
    "invenio-app-rdm>=14.0.0b0,<15.0.0",
    "invenio-base>=2.0.0,<3.0.0",
    "invenio-communities>=28.0.0,<29.0.0",
    "invenio-i18n>=3.0.0,<4.0.0",
    "invenio-jobs>=10.0.0,<11.0.0",
    "invenio-oauthclient>=8.0.0,<9.0.0",
    "invenio-rdm-records>=32.0.0,<33.0.0",
    "invenio-records-permissions>=3.0.0,<4.0.0",
    "invenio-requests>=14.0.0,<15.0.0",
    "invenio-search-ui>=4.0.0,<5.0.0",
    "invenio-stats>=6.0.0,<7.0.0",
    "invenio-theme>=4.0.0,<5.0.0",
    "invenio-users-resources>=12.0.0,<13.0.0",
    "invenio-vocabularies>=13.0.0,<14.0.0",
]

[project.urls]
Homepage = "https://github.com/oarepo/oarepo-config"

[project.optional-dependencies]
dev = [
    "oarepo-invenio-typing-stubs>=0.1.0dev0,<1.0.0",
    "types-PyYAML",
    "lxml-stubs",
    "oarepo-workflows>=9.0.0,<10.0.0",
    "oarepo-requests>=11.0.0,<12.0.0",
    "oarepo-vocabularies>=11.0.0,<12.0.0",
    "oarepo-oidc-einfra>=9.0.0,<10.0.0",
    "oarepo-glitchtip>=1.3.0,<2.0.0",
    "oarepo-communities>=14.0.0,<15.0.0",
    "oarepo-checks>=3.0.0,<4.0.0",
    "oarepo-dashboard>=9.0.0,<10.0.0",
    "oarepo-doi>=8.0.0,<9.0.0",
    "oarepo-rdm>=10.0.0,<11.0.0",
    "oarepo-related-resources>=7.0.0,<8.0.0",
]
tests = [
    "pytest-invenio>=4.0.0,<5.0.0",
    "pytest-oarepo>=7.0.0,<8.0.0",
]
oarepo14 = [
    "oarepo[rdm,tests]>=14.0.0,<15.0.0",
]


[tool.hatch.build.targets.sdist]
include = [
    "/oarepo_config",
]

[[tool.mypy.overrides]]
follow_untyped_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
